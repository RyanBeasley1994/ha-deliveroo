# Deliveroo order map: a map card, and two ways to show it in a popup.
# Entity ids depend on your language and account name: check yours in
# Settings → Entities (e.g. device_tracker.deliveroo_rider_location).

# ── 1. Map card (paste into a dashboard, or use it inside a popup below) ─────
type: map
title: Deliveroo
default_zoom: 15
hours_to_show: 0
entities:
  - entity: device_tracker.deliveroo_rider_location
    name: Rider
  - entity: device_tracker.deliveroo_delivery_location
    name: Home
  - entity: device_tracker.deliveroo_restaurant_location
    name: Restaurant

